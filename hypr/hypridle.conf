# hypridle: boşta kalınca ve uykuda kilit (desk kilit ekranı)
# Kararlar (plan, Aşama 8):
#   pilde : 3 dk karart, 5 dk kilitle ve ekranı kapat, 15 dk uyku
#   prizde: 10 dk karart, 15 dk kilitle ve ekranı kapat, uyku yok
# Video oynarken (tarayıcı, mpv) uygulama boşta kalmayı engeller; hiçbiri olmaz.
# Pil mi priz mi kararını scripts/idle.sh verir; burada süreler sabit.

general {
    # loginctl lock-session (Super+Esc, kapak, uykudan önce) gelince desk'in kilidi açılır.
    # -n: zaten kilitliyse ikincisi açılmaz. ~/.config/quickshell/desk → desk'in klasörü (desk/nix/home.nix).
    # hypridle bir servis (desk/nix/home.nix); çökerse kilit açık kalır, hypridle birkaç saniyede geri gelir.
    lock_cmd = qs -n -p ~/.config/quickshell/desk/lock.qml
    before_sleep_cmd = loginctl lock-session
    # Uykudan dönünce ekranı aç ve kilide klavye odağını ver (idle.sh → resume)
    after_sleep_cmd = ~/.config/hypr/scripts/idle.sh resume
    # Uykuya geçmeden önce kilidin gerçekten ekranı kapladığını bekle
    inhibit_sleep = 3
}

# Pilde: 3 dk karart
listener {
    timeout = 180
    on-timeout = ~/.config/hypr/scripts/idle.sh dim battery
    on-resume = ~/.config/hypr/scripts/idle.sh undim
}

# Pilde: 5 dk kilitle, ekranı kapat
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle.sh lock battery
    on-resume = ~/.config/hypr/scripts/idle.sh wake
}

# Prizde: 10 dk karart
listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/idle.sh dim ac
    on-resume = ~/.config/hypr/scripts/idle.sh undim
}

# Pilde: 15 dk uyku. Prizde: 15 dk kilitle, ekranı kapat
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/idle.sh late
    on-resume = ~/.config/hypr/scripts/idle.sh wake
}
