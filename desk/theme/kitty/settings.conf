# --- Yazı: JetBrains Mono (configuration.nix → fonts.packages)
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
# Satırlar biraz açık: uzun çıktı daha rahat okunur
modify_font      cell_height 110%
# => != gibi işaretler birleşir; imlecin üstündeki ayrık görünür (düzenlerken kafa karıştırmasın)
disable_ligatures cursor

# --- Pencere
window_padding_width 10 14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0

# --- İmleç: ince çizgi, yanıp sönmez (pil), hareket ederken kısa bir iz bırakır
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.3

# --- Kaydırma ve seçim
scrollback_lines 10000
# Seçilen yazı "birincil seçim"e gider: orta tıkla yapıştırılır. Panoya: Ctrl+Shift+C
copy_on_select yes
strip_trailing_spaces smart
url_style curly
detect_urls yes

# --- Sekmeler: üstte, sade; tek sekme varken görünmez
tab_bar_edge top
tab_bar_style separator
tab_separator ""
tab_bar_margin_height 4 4
tab_title_template "  {index} · {title}  "
active_tab_font_style bold
inactive_tab_font_style normal

# --- fish ile kabuk entegrasyonu (komut çıktıları arasında gezinme, yeni sekme aynı klasörde)
shell_integration enabled
